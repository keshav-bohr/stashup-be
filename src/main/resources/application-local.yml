# Local development profile. Values here are for a throwaway local database only.
# Real secrets always come from the environment, never from a committed file.
spring:
  datasource:
    url: ${STASHUP_DB_URL:jdbc:mysql://localhost:3306/stashup}
    username: ${STASHUP_DB_USERNAME:root}
    password: ${STASHUP_DB_PASSWORD:local}
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stashup: DEBUG
